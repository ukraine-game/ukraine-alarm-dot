q('#hgm').textContent='💰 '+$$(E.m);q('#hgi').innerHTML=`<div class=hgt>${u.ic} ${u.n}</div><div class=hgd>${u.d}</div>${bar('ШВИДКІСТЬ',u.spd/1.6)}${bar('РАКЕТИ',(u.cap||0)/8*100)}${bar('РІВЕНЬ',(ix+1)/ord.length*100)}<button class="hgb hgbuy" id=hgbuy>${own?(S.u==i?'✔ ОБРАНО':'ОБРАТИ'):'КУПИТИ '+$$(u.price||0)}</button><div class=hgq>${[['ms:1','🚀+1',400,u.m?E.ms:'—'],['ms:4','🚀×4',1400,u.m?E.ms:'—'],['fu:1','⛽ бак',1500*(E.fu+1),E.fu+'/5'],['can:1','🛢',600,E.can],['fl:1','✨',500,E.fl]].map(x=>`<button class=hgb data-s=${x[0]}>${x[1]} <small>${$$(x[2])} · ${x[3]}</small></button>`).join('')}</div>`;
q('#hgi').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;const[k,n]=b.dataset.s.split(':');shop(k,+n);info()};q('#hgbuy').onclick=()=>{if(own){S.u=i;menu()}else buy(i);info();strip()}}
function strip(){const h=q('#hgs');h.innerHTML=ord.map((i,k)=>{const u=UAVS[i],o=E.own.includes(u.n);return`<div class="hgc${k==ix?' on':''}${o?'':' lk'}" data-k=${k}><div>${u.ic}</div><b>${u.n}</b><small>${o?'✔ Є':$$(u.price||0)}</small></div>`}).join('');const e=h.children[ix];if(e)e.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})}
function go(k){ix=cp(k,0,ord.length-1);try{setM()}catch(e){}info();strip()}
function frame(n){raf=requestAnimationFrame(frame);const c=q('#hgc'),w=c.clientWidth,h=c.clientHeight,dt=Math.min(.05,(n-lt)/1000);lt=n;if(!w||!h)return;if(c.dataset.w!=w+'x'+h){rd.setSize(w,h,false);cm.aspect=w/h;cm.updateProjectionMatrix();c.dataset.w=w+'x'+h}
if(!drag)ry+=dt*.45;pv.rotation.set(rx,ry,0);cm.position.set(0,.8,(w/h<.8?15:11)*dist);cm.lookAt(0,-.2,0);rd.render(sc2,cm)}
const cv=q('#hgc');
cv.onpointerdown=e=>{drag=1;lx=x0=e.clientX;ly=e.clientY;t0=performance.now();cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(!drag)return;ry+=(e.clientX-lx)*.012;rx=cp(rx+(e.clientY-ly)*.008,-.7,1.1);lx=e.clientX;ly=e.clientY};
cv.onpointerup=e=>{drag=0;const dx=e.clientX-x0;if(Math.abs(dx)>150&&performance.now()-t0<220)go(ix+(dx<0?1:-1))};
cv.onwheel=e=>{e.preventDefault();dist=cp(dist*(1+e.deltaY*.001),.55,1.6)};
q('#hgl').onclick=()=>go(ix-1);q('#hgr').onclick=()=>go(ix+1);
q('#hgs').onclick=e=>{const c=e.target.closest('.hgc');if(c)go(+c.dataset.k)};
function openH(){PAUSE=1;ord=UAVS.map((_,i)=>i).sort((a,b)=>(UAVS[a].price||0)-(UAVS[b].price||0));ix=Math.max(0,ord.indexOf(S.u));hg.hidden=false;info();strip();try{if(!rd)init3();setM();lt=performance.now();raf=requestAnimationFrame(frame)}catch(e){q('#hgv').insertAdjacentHTML('afterbegin','<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:90px">'+UAVS[ord[ix]].ic+'</div>')}}
function closeH(){hg.hidden=true;cancelAnimationFrame(raf);PAUSE=0}
q('#hgx').onclick=closeH;q('#bhg').onclick=openH;
addEventListener('keydown',e=>{if(hg.hidden)return;if(e.key=='ArrowRight')go(ix+1);else if(e.key=='ArrowLeft')go(ix-1);else if(e.key=='Escape')closeH()});
setInterval(()=>{fab.style.display=(st=='menu'&&hg.hidden&&sg.hidden)?'flex':'none'},300);
})();
</script></body></html>
